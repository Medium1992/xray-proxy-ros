name: Build and Publish

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC
  workflow_dispatch:

concurrency:
  group: xray-proxy-ros-publish
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE_OWNER: medium1992
      PACKAGE_NAME: xray-proxy-ros
      PACKAGE_NAME_ENCODED: xray-proxy-ros
      DELETE_UNTAGGED: "true"

    steps:
      - name: Install jq and crane
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | sudo tar -C /usr/local/bin -xz crane
          chmod +x /usr/local/bin/crane
          crane version || { echo "Crane failed to install"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Get latest versions
        id: latest_versions
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh_curl() {
            if [ -n "${GH_API_TOKEN:-}" ]; then
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_API_TOKEN" "$@"
            else
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
                -H "Accept: application/vnd.github+json" "$@"
            fi
          }

          XRAY=$(gh_curl https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r '.tag_name')
          case "$XRAY" in
            ''|null) echo "Xray release tag is empty" >&2; exit 1 ;;
          esac
          echo "xray=$XRAY" >> $GITHUB_ENV
      
      - name: Compare with VERSIONS
        id: check_versions
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run → force build"
            echo "build_needed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ ! -f VERSIONS ]; then
            echo "No VERSIONS file, need build"
            echo "build_needed=true" >> $GITHUB_OUTPUT
          else
            NEED_BUILD=false
            while IFS='=' read -r name version; do
              LATEST=${!name}
              if [ "$LATEST" != "$version" ]; then
                NEED_BUILD=true
                break
              fi
            done < VERSIONS
            echo "build_needed=$NEED_BUILD" >> $GITHUB_OUTPUT
          fi
      
      - name: Update VERSIONS
        if: steps.check_versions.outputs.build_needed == 'true'
        run: |
          echo "xray=${{ env.xray }}" > VERSIONS

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        if: steps.check_versions.outputs.build_needed == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Login to GitHub Container Registry
        if: steps.check_versions.outputs.build_needed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch
        if: steps.check_versions.outputs.build_needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v5
          push: true
          build-args: |
            XRAY_RELEASE_TAG=${{ env.xray }}
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/medium1992/xray-proxy-ros:${{ env.xray }}
            ghcr.io/medium1992/xray-proxy-ros:latest
            medium1992/xray-proxy-ros:${{ env.xray }}
            medium1992/xray-proxy-ros:latest

      - name: Publish container archives to Telegram
        if: steps.check_versions.outputs.build_needed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          IMAGE_REPO: medium1992/xray-proxy-ros
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets are not configured, skipping Telegram publish."
            exit 0
          fi

          telegram_api() {
            local method="$1"
            shift

            response=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/${method}" "$@")
            echo "$response" | grep -q '"ok":true' || {
              echo "Telegram API call failed:"
              echo "$response"
              exit 1
            }
          }

          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "Attempt ${attempt} failed, retrying..."
              sleep 10
            done
            "$@"
          }

          thread_data_args=()
          thread_form_args=()
          if [ -n "${TELEGRAM_THREAD_ID}" ]; then
            thread_data_args=(-d "message_thread_id=${TELEGRAM_THREAD_ID}")
            thread_form_args=(-F "message_thread_id=${TELEGRAM_THREAD_ID}")
          fi

          mkdir -p telegram-images

          export_image() {
            local name="$1"
            local platform="$2"
            local image="$3"
            local file="telegram-images/xray-proxy-ros-${name}-${xray}.tar.gz"

            retry docker pull --platform "${platform}" "${image}"
            docker save "${image}" | gzip -9 > "${file}"
            docker image rm "${image}" || true
          }

          export_image "amd64" "linux/amd64" "${IMAGE_REPO}:${xray}"
          export_image "arm64" "linux/arm64" "${IMAGE_REPO}:${xray}"
          export_image "armv7" "linux/arm/v7" "${IMAGE_REPO}:${xray}"
          export_image "armv5" "linux/arm/v5" "${IMAGE_REPO}:${xray}"

          sha256sum telegram-images/*.tar.gz > telegram-images/sha256sums.txt

          files_list=$(find telegram-images -maxdepth 1 -name '*.tar.gz' -type f -printf '%f\n' | sort)
          message=$(printf 'Xray Proxy ROS container images\n\nxray: %s\n\nDocker Hub: https://hub.docker.com/r/%s\n\nFiles:\n%s\n\nChecksums: sha256sums.txt' \
            "${xray}" \
            "${IMAGE_REPO}" \
            "${files_list}")

          telegram_api sendMessage \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            "${thread_data_args[@]}" \
            --data-urlencode "text=${message}"

          while IFS= read -r file; do
            telegram_api sendDocument \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              "${thread_form_args[@]}" \
              -F "document=@${file}" \
              -F "caption=$(basename "$file")"
          done < <(find telegram-images -maxdepth 1 -name '*.tar.gz' -type f | sort)

          telegram_api sendDocument \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            "${thread_form_args[@]}" \
            -F "document=@telegram-images/sha256sums.txt" \
            -F "caption=sha256sums.txt"
          
      - name: Commit and push VERSIONS
        if: steps.check_versions.outputs.build_needed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add VERSIONS
          git commit -m "Auto-update: VERSIONS" || exit 0
          git push

      - name: Log in to GHCR with crane
        if: steps.check_versions.outputs.build_needed == 'true'
        run: echo "${GITHUB_TOKEN}" | crane auth login ghcr.io -u ${PACKAGE_OWNER} --password-stdin

      - name: Analyze GHCR packages (dry-run)
        if: steps.check_versions.outputs.build_needed == 'true'
        id: analyze
        run: |
          set -e

          echo "Fetching package versions for ${PACKAGE_OWNER}/${PACKAGE_NAME}..."
          page=1
          packages_json="[]"
          last_first_id=""
          while true; do
            echo "Fetching page $page..."
            chunk=$(timeout 30s gh api -H "Accept: application/vnd.github+json" \
              /users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME_ENCODED}/versions?per_page=100&page=$page || echo "TIMEOUT")
            if [[ "$chunk" == "TIMEOUT" ]]; then
              echo "Error: gh api timed out on page $page"
              exit 1
            fi
            echo "Page $page raw chunk: ${chunk:0:50}..."
            chunk_count=$(echo "$chunk" | jq length)
            echo "Page $page: $chunk_count versions"
            if [[ "$chunk_count" -eq 0 ]]; then
              echo "No more versions on page $page (empty response)"
              break
            fi
            first_id=$(echo "$chunk" | jq -r '.[0].id // ""')
            if [[ -n "$last_first_id" && "$first_id" == "$last_first_id" ]]; then
              echo "Page $page has same data as previous (ID: $first_id), stopping"
              break
            fi
            last_first_id="$first_id"
            if [[ "$packages_json" == "[]" ]]; then
              packages_json="$chunk"
            else
              packages_json=$(jq -s '.[0] + .[1]' <(echo "$packages_json") <(echo "$chunk"))
            fi
            ((page++))
            if [[ $page -gt 10 ]]; then
              echo "Reached max page limit (10)"
              break
            fi
          done

          total=$(echo "$packages_json" | jq length)
          echo "Total versions found: $total (pages processed: $((page-1)))"
          echo ""

          declare -A protected_digests
          declare -A child_digests
          # Cache manifest lookups by digest — one crane call per unique manifest,
          # not per tag. Saves N×duplicate work when a manifest carries multiple tags.
          declare -A manifest_seen

          echo "=== 🏷️ Tagged manifests ==="
          # Iterate over each tagged version exactly once.
          while IFS=$'\t' read -r id digest tags created mediaType; do
            [[ -z "$id" ]] && continue
            protected_digests[$digest]=1
            echo "  📦 Inspecting manifest $digest (tags: [$tags])"
            if [[ -z "${manifest_seen[$digest]}" ]]; then
              manifest_seen[$digest]=1
              # Multi-arch index has .manifests[]; single-arch manifest has no such field.
              # `(.manifests // [])[].digest` returns nothing for single-arch, no jq crash.
              manifest_json=$(timeout 10s crane manifest "ghcr.io/${PACKAGE_OWNER}/${PACKAGE_NAME}@${digest}" 2>/dev/null || echo "{}")
              sub_digests=$(echo "$manifest_json" | jq -r '(.manifests // [])[].digest // empty')
              for sd in $sub_digests; do
                [[ -n "$sd" ]] || continue
                child_digests[$sd]=1
                protected_digests[$sd]=1
                echo "    → Protected child digest: $sd"
              done
            else
              echo "    → (manifest already inspected for an earlier tag, reusing cache)"
            fi
            echo "- ID: $id | Digest: $digest | Tags: [$tags] | Created: $created | Type: manifest ($mediaType)"
          done < <(echo "$packages_json" | jq -r '
            .[] | select((.metadata.container.tags // []) | length > 0) |
            [ .id,
              .name,
              ((.metadata.container.tags // []) | join(", ")),
              .created_at,
              (.metadata.container.manifest.mediaType // "unknown")
            ] | @tsv')

          echo ""
          echo "Protected child digests count: ${#child_digests[@]}"
          echo ""

          # Untagged: reuse data already in packages_json — no extra gh api per id.
          echo "=== 🧩 Untagged images ==="
          safe_untagged_ids=()
          while IFS=$'\t' read -r id digest created mediaType; do
            [[ -z "$id" ]] && continue
            if [[ -n "${protected_digests[$digest]}" ]]; then
              echo "- ID: $id | Digest: $digest | Created: $created | Type: $mediaType → 🛡 пропущен (child or referenced)"
            else
              echo "- ID: $id | Digest: $digest | Created: $created | Type: $mediaType → 🧹 кандидат на удаление"
              safe_untagged_ids+=("$id")
            fi
          done < <(echo "$packages_json" | jq -r '
            .[] | select((.metadata.container.tags // []) | length == 0) |
            [ .id,
              (.name // "unknown"),
              (.created_at // "unknown"),
              (.metadata.container.manifest.mediaType // "unknown")
            ] | @tsv')

          echo ""
          echo "Safe untagged IDs (before validation): ${safe_untagged_ids[*]}"
          validated_ids=()
          for id in "${safe_untagged_ids[@]}"; do
            if gh api -H "Accept: application/vnd.github+json" \
              /users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME_ENCODED}/versions/$id >/dev/null 2>&1; then
              validated_ids+=("$id")
              echo "Version $id exists, added to deletion list"
            else
              echo "Version $id not found, skipping"
            fi
          done

          echo ""
          echo "Validated untagged IDs: ${validated_ids[*]}"
          if [ ${#validated_ids[@]} -eq 0 ]; then
            echo "No valid untagged IDs to delete"
            echo "safe_untagged_ids_comma=" >> $GITHUB_OUTPUT
          else
            safe_untagged_ids_comma=$(echo "${validated_ids[*]}" | tr ' ' ', ')
            echo "safe_untagged_ids_comma=$safe_untagged_ids_comma" >> $GITHUB_OUTPUT
          fi

      - name: Cleanup untagged GHCR versions
        if: env.DELETE_UNTAGGED == 'true' && steps.analyze.outputs.safe_untagged_ids_comma != ''
        uses: actions/delete-package-versions@v5
        with:
          package-name: '${{ env.PACKAGE_NAME }}'
          package-type: 'container'
          package-version-ids: '${{ steps.analyze.outputs.safe_untagged_ids_comma }}'
          token: ${{ env.GITHUB_TOKEN }}
