name: Build and Publish Alpha

# Апстрим Xray не публикует покоммитные сборки: ассеты релиза появляются только
# на `release: published`, а пуши уезжают в Actions-артефакты, которые живут 90
# дней и требуют авторизации. Поэтому alpha собирает ядро из HEAD сама и кладёт
# бинарники в катящийся релиз `alpha` этого репозитория, откуда их и забирает
# образ.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: xray-proxy-ros-publish
  cancel-in-progress: false

env:
  XRAY_REPO: XTLS/Xray-core

jobs:
  alpha-check:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.compare.outputs.build_needed }}
      sha: ${{ steps.upstream.outputs.sha }}
      version: ${{ steps.upstream.outputs.version }}
      go_version: ${{ steps.upstream.outputs.go_version }}

    steps:
      - name: Resolve upstream HEAD
        id: upstream
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # api.github.com без токена — 60 запросов/час на общий IP раннера.
          # -f нужен, чтобы HTTP-ошибка не утекла в jq как валидный JSON.
          gh_curl() {
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              -H "Accept: application/vnd.github+json" \
              ${GH_API_TOKEN:+-H "Authorization: Bearer $GH_API_TOKEN"} "$@"
          }

          BRANCH=$(gh_curl "https://api.github.com/repos/${XRAY_REPO}" | jq -r '.default_branch // empty')
          SHA=$(gh_curl "https://api.github.com/repos/${XRAY_REPO}/commits/${BRANCH}" | jq -r '.sha // empty')

          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Could not resolve ${XRAY_REPO}@${BRANCH} to a commit: '$SHA'" >&2
            exit 1
          fi
          SHORT_SHA=${SHA:0:7}

          # Версия ядра живёт в core/core.go как три отдельные байтовые
          # константы; тега у коммита из main нет, поэтому собираем её оттуда.
          CORE_GO=$(gh_curl -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${XRAY_REPO}/contents/core/core.go?ref=${SHA}")
          read_const() {
            printf '%s' "$CORE_GO" | sed -nE "s/^[[:space:]]*$1[[:space:]]+byte[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p" | head -n1
          }
          X=$(read_const Version_x); Y=$(read_const Version_y); Z=$(read_const Version_z)

          if [ -z "$X" ] || [ -z "$Y" ] || [ -z "$Z" ]; then
            echo "Could not read Version_x/y/z out of core/core.go at ${SHA}" >&2
            exit 1
          fi
          VERSION="v${X}.${Y}.${Z}-${SHORT_SHA}"

          # Xray собирается стоковым Go (setup-go по go.mod, без форка
          # тулчейна), так что берём свежий стабильный релиз go.dev.
          GO_VERSION=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://go.dev/dl/?mode=json" | jq -r '[.[] | select(.stable)][0].version // empty' | sed 's/^go//')

          if ! printf '%s' "$GO_VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "Could not resolve a stable Go version: '$GO_VERSION'" >&2
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "Upstream ${XRAY_REPO}@${SHORT_SHA} -> ${VERSION}, Go ${GO_VERSION}"

      - name: Read the version our alpha release already carries
        id: mine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Пока релиза нет, gh api отвечает 404 телом в stdout, поэтому
          # разбираем ответ только после успешного запроса.
          current="none"
          if response=$(gh api "repos/${{ github.repository }}/releases/tags/alpha" 2>/dev/null); then
            url=$(printf '%s' "$response" | jq -r '.assets[]? | select(.name == "version.txt") | .url' 2>/dev/null | head -n1 || true)
            if [ -n "$url" ]; then
              current=$(gh api -H "Accept: application/octet-stream" "$url" 2>/dev/null | tr -d '\r\n' || true)
            fi
          fi
          [ -n "$current" ] || current="none"

          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Decide whether a build is needed
        id: compare
        run: |
          set -euo pipefail
          TARGET='${{ steps.upstream.outputs.version }}'
          CURRENT='${{ steps.mine.outputs.current }}'
          echo "target:  $TARGET"
          echo "current: $CURRENT"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual run -> force build"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = "$CURRENT" ]; then
            echo "Already built this commit"
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream commit"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

  alpha-build:
    needs: alpha-check
    if: needs.alpha-check.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: Xray-linux-64.zip
            platform: linux/amd64
          - asset: Xray-linux-arm64-v8a.zip
            platform: linux/arm64
          - asset: Xray-linux-arm32-v7a.zip
            platform: linux/arm/v7
          - asset: Xray-linux-arm32-v5.zip
            platform: linux/arm/v5

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # Кросс-компиляция: все стадии Dockerfile-release идут на BUILDPLATFORM,
      # а целевая архитектура приходит аргументами, поэтому QEMU не нужен.
      - name: Build the Xray core
        run: |
          set -euo pipefail
          docker buildx build \
            -f Dockerfile-release \
            --platform ${{ matrix.platform }} \
            --build-arg XRAY_REPO=${{ env.XRAY_REPO }} \
            --build-arg XRAY_REF=${{ needs.alpha-check.outputs.sha }} \
            --build-arg GO_VERSION=${{ needs.alpha-check.outputs.go_version }} \
            --output type=local,dest=out \
            --progress=plain \
            .

      - name: Package the asset
        run: |
          set -euo pipefail
          mkdir -p dist
          chmod 0755 out/xray
          (cd out && zip -9 "${GITHUB_WORKSPACE}/dist/${{ matrix.asset }}" xray)

      - uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  alpha-release:
    needs: [alpha-check, alpha-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect the release payload
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name '*.zip' -exec cp {} release/ \;
          echo '${{ needs.alpha-check.outputs.version }}' > release/version.txt
          (cd release && sha256sum ./*.zip > sha256sums.txt)
          ls -l release

      # Релиз катящийся, поэтому старый сносится целиком вместе с тегом: иначе
      # softprops дописывает ассеты к уже существующему набору.
      # Релиз катящийся, поэтому старый сносится целиком вместе с тегом: иначе
      # softprops дописывает ассеты к уже существующему набору.
      #
      # gh api печатает тело ответа в stdout и при 404, а --jq к неуспешному
      # запросу не применяется, поэтому подстановка отдавала JSON ошибки как
      # значение id. Берём его только когда запрос действительно удался.
      - name: Replace the alpha release
        run: |
          set -euo pipefail
          release_id=""
          if response=$(gh api "repos/${{ github.repository }}/releases/tags/alpha" 2>/dev/null); then
            release_id=$(printf '%s' "$response" | jq -r '.id // empty' 2>/dev/null || true)
          fi

          if printf '%s' "$release_id" | grep -Eq '^[0-9]+$'; then
            echo "Deleting release $release_id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/${release_id}"
          else
            echo "No alpha release to delete"
          fi

          if gh api "repos/${{ github.repository }}/git/refs/tags/alpha" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/alpha"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: alpha
          name: Xray core alpha ${{ needs.alpha-check.outputs.version }}
          body: |
            Ядро Xray, собранное из ${{ env.XRAY_REPO }}@${{ needs.alpha-check.outputs.sha }}
            на Go ${{ needs.alpha-check.outputs.go_version }}.

            Релиз катящийся: ассеты заменяются на каждой новой сборке.
          prerelease: true
          make_latest: false
          files: release/*

  alpha-image:
    needs: [alpha-check, alpha-build, alpha-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE_OWNER: medium1992
      PACKAGE_NAME: xray-proxy-ros
      GHCR_IMAGE: ghcr.io/medium1992/xray-proxy-ros
      DOCKERHUB_IMAGE: medium1992/xray-proxy-ros
      DELETE_UNTAGGED: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Record the published version
        run: echo 'xray=${{ needs.alpha-check.outputs.version }}' > VERSIONS_ALPHA

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push alpha multi-arch
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v5
          push: true
          provenance: false
          sbom: false
          build-args: |
            XRAY_RELEASE_REPO=${{ github.repository }}
            XRAY_RELEASE_TAG=alpha
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ needs.alpha-check.outputs.version }}
            ${{ env.GHCR_IMAGE }}:alpha
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.alpha-check.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE }}:alpha

      - name: Commit and push VERSIONS_ALPHA
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add VERSIONS_ALPHA
          git commit -m "Auto-update: VERSIONS_ALPHA" || exit 0
          git push

      - name: Install crane
        run: |
          set -euo pipefail
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -C /usr/local/bin -xz crane
          sudo chmod +x /usr/local/bin/crane
          crane version

      - name: Log in to GHCR with crane
        run: echo "${GITHUB_TOKEN}" | crane auth login ghcr.io -u "${PACKAGE_OWNER}" --password-stdin

      # Платформенные образы под индексом тоже без тегов, поэтому сначала
      # обходим теги через crane и защищаем их дочерние digest.
      - name: Analyze GHCR package versions
        id: analyze
        run: |
          set -euo pipefail

          page=1
          packages_json='[]'
          while [ "${page}" -le 10 ]; do
            chunk=$(gh api -H "Accept: application/vnd.github+json" \
              "/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=${page}")
            [ "$(echo "${chunk}" | jq 'length')" -gt 0 ] || break
            packages_json=$(jq -s '.[0] + .[1]' <(echo "${packages_json}") <(echo "${chunk}"))
            page=$((page + 1))
          done
          echo "Total versions: $(echo "${packages_json}" | jq 'length')"

          protected=$(mktemp)
          while IFS=$'\t' read -r digest tags; do
            [ -n "${digest}" ] || continue
            echo "${digest}" >> "${protected}"
            echo "tagged ${digest} [${tags}]"
            crane manifest "ghcr.io/${PACKAGE_OWNER}/${PACKAGE_NAME}@${digest}" 2>/dev/null \
              | jq -r '(.manifests // [])[].digest // empty' >> "${protected}" || true
          done < <(echo "${packages_json}" | jq -r '
            .[] | select((.metadata.container.tags // []) | length > 0)
            | [ .name, ((.metadata.container.tags // []) | join(",")) ] | @tsv')

          sort -u "${protected}" -o "${protected}"

          removable=$(echo "${packages_json}" | jq -r '
            .[] | select((.metadata.container.tags // []) | length == 0)
            | [ .id, .name ] | @tsv' \
            | while IFS=$'\t' read -r id digest; do
                grep -qxF "${digest}" "${protected}" || printf '%s\n' "${id}"
              done | paste -sd, -)

          echo "Removable version ids: ${removable:-<none>}"
          echo "removable=${removable}" >> "${GITHUB_OUTPUT}"

      - name: Delete untagged GHCR versions
        if: env.DELETE_UNTAGGED == 'true' && steps.analyze.outputs.removable != ''
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: container
          package-version-ids: ${{ steps.analyze.outputs.removable }}
          token: ${{ secrets.GITHUB_TOKEN }}
