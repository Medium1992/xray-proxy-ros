name: Build and Publish

# Ядро собирается из исходников по тегу релиза, а не скачивается официальным
# zip: так оно едет на свежем Go вместо того, что стоит в go.mod апстрима.
# Бинарники ложатся в катящийся релиз `stable` этого репозитория, откуда их
# забирает образ.
on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC
  workflow_dispatch:

concurrency:
  group: xray-proxy-ros-publish
  cancel-in-progress: false

env:
  XRAY_REPO: XTLS/Xray-core

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.compare.outputs.build_needed }}
      version: ${{ steps.upstream.outputs.version }}
      go_version: ${{ steps.upstream.outputs.go_version }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve the Xray release
        id: upstream
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # api.github.com без токена — 60 запросов/час на общий IP раннера.
          # -f нужен, чтобы HTTP-ошибка не утекла в jq как валидный JSON.
          gh_curl() {
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              -H "Accept: application/vnd.github+json" \
              ${GH_API_TOKEN:+-H "Authorization: Bearer $GH_API_TOKEN"} "$@"
          }

          # Самый свежий релиз, включая pre-release. Черновики пропускаем:
          # у них ещё нет тега.
          VERSION=$(gh_curl "https://api.github.com/repos/${XRAY_REPO}/releases?per_page=20" \
            | jq -r '[.[] | select(.draft == false)] | sort_by(.published_at) | last | .tag_name // empty')

          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z]+)*$'; then
            echo "Invalid Xray release tag: '$VERSION'" >&2
            exit 1
          fi

          # Xray собирается стоковым Go (setup-go по go.mod, без форка
          # тулчейна), так что берём свежий стабильный релиз go.dev.
          GO_VERSION=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://go.dev/dl/?mode=json" | jq -r '[.[] | select(.stable)][0].version // empty' | sed 's/^go//')

          if ! printf '%s' "$GO_VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "Could not resolve a stable Go version: '$GO_VERSION'" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Xray ${VERSION}, Go ${GO_VERSION}"

      - name: Decide whether a build is needed
        id: compare
        run: |
          set -euo pipefail
          TARGET='${{ steps.upstream.outputs.version }}'

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual run -> force build"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          elif [ -f VERSIONS ] && grep -qx "xray=${TARGET}" VERSIONS; then
            echo "Xray ${TARGET} is already published"
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New Xray release: ${TARGET}"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: Xray-linux-64.zip
            platform: linux/amd64
            binary: xray-linux-amd64
          - asset: Xray-linux-arm64-v8a.zip
            platform: linux/arm64
            binary: xray-linux-arm64
          - asset: Xray-linux-arm32-v7a.zip
            platform: linux/arm/v7
            binary: ""
          - asset: Xray-linux-arm32-v5.zip
            platform: linux/arm/v5
            binary: ""

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # Кросс-компиляция: все стадии Dockerfile-release идут на BUILDPLATFORM,
      # а целевая архитектура приходит аргументами, поэтому QEMU не нужен.
      - name: Build the Xray core
        run: |
          set -euo pipefail
          docker buildx build \
            -f Dockerfile-release \
            --platform ${{ matrix.platform }} \
            --build-arg XRAY_REPO=${{ env.XRAY_REPO }} \
            --build-arg XRAY_REF=${{ needs.check.outputs.version }} \
            --build-arg GO_VERSION=${{ needs.check.outputs.go_version }} \
            --build-arg XRAY_VERSION_SUFFIX=ros \
            --output type=local,dest=out \
            --progress=plain \
            .

      - name: Package the asset
        run: |
          set -euo pipefail
          mkdir -p dist
          chmod 0755 out/xray
          (cd out && zip -9 "${GITHUB_WORKSPACE}/dist/${{ matrix.asset }}" xray)
          if [ -n "${{ matrix.binary }}" ]; then
            cp out/xray "dist/${{ matrix.binary }}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect the release payload
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          (cd release && sha256sum ./* > ../sha256sums.txt && mv ../sha256sums.txt .)
          echo '${{ needs.check.outputs.version }}' > release/version.txt
          ls -l release

      # Релиз катящийся, поэтому старый сносится целиком вместе с тегом: иначе
      # softprops дописывает ассеты к уже существующему набору.
      #
      # gh api печатает тело ответа в stdout и при 404, а --jq к неуспешному
      # запросу не применяется, поэтому подстановка отдавала JSON ошибки как
      # значение id. Берём его только когда запрос действительно удался.
      - name: Replace the stable release
        run: |
          set -euo pipefail
          release_id=""
          if response=$(gh api "repos/${{ github.repository }}/releases/tags/stable" 2>/dev/null); then
            release_id=$(printf '%s' "$response" | jq -r '.id // empty' 2>/dev/null || true)
          fi

          if printf '%s' "$release_id" | grep -Eq '^[0-9]+$'; then
            echo "Deleting release $release_id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/${release_id}"
          else
            echo "No stable release to delete"
          fi

          if gh api "repos/${{ github.repository }}/git/refs/tags/stable" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/stable"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: stable
          name: Xray core ${{ needs.check.outputs.version }}
          body: |
            Ядро Xray, собранное из ${{ env.XRAY_REPO }}@${{ needs.check.outputs.version }}
            на Go ${{ needs.check.outputs.go_version }}.

            Архивы под четыре архитектуры RouterOS, плюс распакованные бинарники
            amd64 и arm64 для запуска вне контейнера.

            Релиз катящийся: ассеты заменяются на каждой новой сборке.
          make_latest: true
          files: release/*

  image:
    needs: [check, build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE_OWNER: medium1992
      PACKAGE_NAME: xray-proxy-ros
      GHCR_IMAGE: ghcr.io/medium1992/xray-proxy-ros
      DOCKERHUB_IMAGE: medium1992/xray-proxy-ros
      DELETE_UNTAGGED: "true"
      xray: ${{ needs.check.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Record the published version
        run: echo "xray=${xray}" > VERSIONS

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v5
          push: true
          provenance: false
          sbom: false
          build-args: |
            XRAY_RELEASE_REPO=${{ github.repository }}
            XRAY_RELEASE_TAG=stable
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.xray }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.xray }}
            ${{ env.DOCKERHUB_IMAGE }}:latest

      - name: Publish container archives to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          IMAGE_REPO: medium1992/xray-proxy-ros
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets are not configured, skipping Telegram publish."
            exit 0
          fi

          telegram_api() {
            local method="$1"
            shift

            response=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/${method}" "$@")
            echo "$response" | grep -q '"ok":true' || {
              echo "Telegram API call failed:"
              echo "$response"
              exit 1
            }
          }

          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "Attempt ${attempt} failed, retrying..."
              sleep 10
            done
            "$@"
          }

          thread_data_args=()
          thread_form_args=()
          if [ -n "${TELEGRAM_THREAD_ID}" ]; then
            thread_data_args=(-d "message_thread_id=${TELEGRAM_THREAD_ID}")
            thread_form_args=(-F "message_thread_id=${TELEGRAM_THREAD_ID}")
          fi

          mkdir -p telegram-images

          export_image() {
            local name="$1"
            local platform="$2"
            local image="$3"
            local file="telegram-images/xray-proxy-ros-${name}-${xray}.tar.gz"

            retry docker pull --platform "${platform}" "${image}"
            docker save "${image}" | gzip -9 > "${file}"
            docker image rm "${image}" || true
          }

          export_image "amd64" "linux/amd64" "${IMAGE_REPO}:${xray}"
          export_image "arm64" "linux/arm64" "${IMAGE_REPO}:${xray}"
          export_image "armv7" "linux/arm/v7" "${IMAGE_REPO}:${xray}"
          export_image "armv5" "linux/arm/v5" "${IMAGE_REPO}:${xray}"

          sha256sum telegram-images/*.tar.gz > telegram-images/sha256sums.txt

          files_list=$(find telegram-images -maxdepth 1 -name '*.tar.gz' -type f -printf '%f\n' | sort)
          message=$(printf 'Xray Proxy ROS container images\n\nxray: %s\n\nDocker Hub: https://hub.docker.com/r/%s\n\nFiles:\n%s\n\nChecksums: sha256sums.txt' \
            "${xray}" \
            "${IMAGE_REPO}" \
            "${files_list}")

          telegram_api sendMessage \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            "${thread_data_args[@]}" \
            --data-urlencode "text=${message}"

          while IFS= read -r file; do
            telegram_api sendDocument \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              "${thread_form_args[@]}" \
              -F "document=@${file}" \
              -F "caption=$(basename "$file")"
          done < <(find telegram-images -maxdepth 1 -name '*.tar.gz' -type f | sort)

          telegram_api sendDocument \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            "${thread_form_args[@]}" \
            -F "document=@telegram-images/sha256sums.txt" \
            -F "caption=sha256sums.txt"

      - name: Commit and push VERSIONS
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add VERSIONS
          git commit -m "Auto-update: VERSIONS" || exit 0
          git push

      - name: Install crane
        run: |
          set -euo pipefail
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -C /usr/local/bin -xz crane
          sudo chmod +x /usr/local/bin/crane
          crane version

      - name: Log in to GHCR with crane
        run: echo "${GITHUB_TOKEN}" | crane auth login ghcr.io -u "${PACKAGE_OWNER}" --password-stdin

      # Платформенные образы под индексом тоже без тегов, поэтому сначала
      # обходим теги через crane и защищаем их дочерние digest.
      - name: Analyze GHCR package versions
        id: analyze
        run: |
          set -euo pipefail

          page=1
          packages_json='[]'
          while [ "${page}" -le 10 ]; do
            chunk=$(gh api -H "Accept: application/vnd.github+json" \
              "/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=${page}")
            [ "$(echo "${chunk}" | jq 'length')" -gt 0 ] || break
            packages_json=$(jq -s '.[0] + .[1]' <(echo "${packages_json}") <(echo "${chunk}"))
            page=$((page + 1))
          done
          echo "Total versions: $(echo "${packages_json}" | jq 'length')"

          protected=$(mktemp)
          while IFS=$'\t' read -r digest tags; do
            [ -n "${digest}" ] || continue
            echo "${digest}" >> "${protected}"
            echo "tagged ${digest} [${tags}]"
            crane manifest "ghcr.io/${PACKAGE_OWNER}/${PACKAGE_NAME}@${digest}" 2>/dev/null \
              | jq -r '(.manifests // [])[].digest // empty' >> "${protected}" || true
          done < <(echo "${packages_json}" | jq -r '
            .[] | select((.metadata.container.tags // []) | length > 0)
            | [ .name, ((.metadata.container.tags // []) | join(",")) ] | @tsv')

          sort -u "${protected}" -o "${protected}"

          removable=$(echo "${packages_json}" | jq -r '
            .[] | select((.metadata.container.tags // []) | length == 0)
            | [ .id, .name ] | @tsv' \
            | while IFS=$'\t' read -r id digest; do
                grep -qxF "${digest}" "${protected}" || printf '%s\n' "${id}"
              done | paste -sd, -)

          echo "Removable version ids: ${removable:-<none>}"
          echo "removable=${removable}" >> "${GITHUB_OUTPUT}"

      - name: Delete untagged GHCR versions
        if: env.DELETE_UNTAGGED == 'true' && steps.analyze.outputs.removable != ''
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: container
          package-version-ids: ${{ steps.analyze.outputs.removable }}
          token: ${{ secrets.GITHUB_TOKEN }}
